<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>공지</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }
    .center-text {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 8vw; /* 화면 꽉 차게 큼 */
      font-weight: 900;
      text-align: center;
      word-break: keep-all;
    }
  </style>
</head>
<body>
  <div class="center-text">
    허동하 병신
  </div>
</body>
</html>
